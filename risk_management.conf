Alias /risk_management /var/www/html/risk_management/public

<Directory /var/www/html/risk_management/public>
    AllowOverride All
    Require all granted
    Options -Indexes
    RewriteEngine On
    RewriteBase /risk_management/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L]
</Directory>

# Static assets — served directly by Apache, no proxy
ProxyPassMatch ^/risk_management/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ !

# Everything else — forward to Laravel via PHP-FPM
ProxyPassMatch ^/risk_management(/.*)?$ fcgi://127.0.0.1:9002/var/www/public/index.php


# inside Apache config :    /etc/httpd/conf.d/risk_management.conf

